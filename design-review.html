<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APP Explorer — design review</title>
  <style>
    body {
      margin: 0;
      font: 16px/1.5 Arial, sans-serif;
      color: #0f2847;
      background: #fff;
    }
    .review-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 20px;
      background: #dbe3f4;
    }
    .review-tools p { margin: 0; }
    .review-tools button {
      padding: 10px 16px;
      background: #3b66bc;
      color: white;
      border: 0;
      border-radius: 5px;
      font: inherit;
      cursor: pointer;
    }
    .review-tools button:disabled { opacity: .5; }
    #status { padding: 12px 20px; }
    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 80px);
      border: 0;
      background: white;
    }
  </style>

  <!-- Styles added to the revised explorer. -->
  <script type="text/plain" id="review-css">
    :root {
      --ink: #0f2847;
      --brand: #3b66bc;
      --brand-dark: #0f2847;
      --accent: #f9466c;
      --green: #03b594;
      --peacock: #07dbb3;
      --light-blue: #dbe3f4;
      --soft: #dbe3f4;
      --soft-2: #dbe3f4;
    }

    /* Solid navy banner. */
    header {
      background: var(--ink);
      color: white;
      overflow: hidden;
    }

    /* White top navigation with blue links and icons. */
    .topbar {
      background: white;
      box-shadow: 0 0 0 100vmax white;
      clip-path: inset(0 -100vmax);
      border-bottom: 0;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .brand-mark { color: var(--ink); }
    .topbar nav a {
      color: var(--brand);
    }
    .topbar nav a:hover,
    .topbar nav a:focus {
      color: var(--ink);
    }
    .header-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: .3rem .65rem;
      margin-left: auto;
      color: var(--brand);
    }
    .header-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .3rem;
      min-height: 44px;
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
      font-size: .95rem;
    }
    .header-links a:hover {
      color: var(--ink);
      text-decoration: underline;
    }
    .header-links .social-link {
      min-width: 44px;
    }
    .header-links svg {
      display: block;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .header-links .newsletter-icon {
      width: 18px;
      height: 18px;
    }
    .header-links .homepage-link {
      padding-left: .65rem;
    }

    /* Confirmed typography: sizes and line heights in pixels. */
    h1, h2 {
      font-family: "Neuton", Georgia, serif;
      font-weight: 400;
    }
    h1 {
      font-size: 21px;
      line-height: 23px;
      letter-spacing: normal;
      text-transform: none;
    }
    h2 {
      font-size: 15px;
      line-height: 18px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    /* Light blue information box in the banner. */
    .pilot-panel {
      background: var(--light-blue);
      color: var(--ink);
      border-color: var(--light-blue);
    }
    .pilot-panel strong,
    .hero .pilot-panel p {
      color: var(--ink);
    }
    .pilot-panel a {
      color: var(--brand);
    }
    .pilot-panel a:hover {
      background: white;
      color: var(--ink);
    }

    /* Grey box fills replaced by the guide's light blue. */
    .metric,
    .guide-box,
    .choose-prompt,
    .empty,
    .notice.info,
    .task[aria-selected="true"],
    tr.selected td,
    .combo-list li[aria-selected="true"],
    .combo-list li:hover {
      background: var(--light-blue);
    }

    /* Accent lines use the named palette variables. */
    .notice,
    .guide-box.warn {
      border-color: var(--accent);
    }
    .notice.info,
    .guide-box.method {
      border-color: var(--brand);
    }
    .guide-box.more {
      border-top-color: var(--green);
    }

    /* Table headers match the primary blue button. */
    th {
      background: var(--brand);
      color: white;
    }
    th a,
    th button,
    th .link-button {
      color: white;
    }

    @media (max-width: 560px) {
      .header-links {
        margin-left: 0;
        justify-content: flex-start;
      }
      .header-links .homepage-link {
        padding-left: 0;
      }
    }
  </script>

  <!-- Right-hand header links: no search icon. -->
  <template id="header-links">
    <nav class="header-links" aria-label="TASO links">
      <a href="https://taso.org.uk/newsletter/">
        <svg class="newsletter-icon" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.5"
             aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m3 6 9 7 9-7M3 18l6-6m12 6-6-6"/>
        </svg>
        Sign up for our newsletter
      </a>

      <a class="social-link"
         href="https://github.com/taso-he/technicalguide"
         aria-label="TASO technical guides on GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.55v-2.14c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.95.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.16 1.18a10.95 10.95 0 0 1 5.75 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.24 2.75.12 3.04.73.8 1.18 1.82 1.18 3.08 0 4.42-2.69 5.4-5.25 5.68.41.36.78 1.06.78 2.14v3.16c0 .3.21.66.79.55A11.5 11.5 0 0 0 12 .7Z"/>
        </svg>
      </a>

      <a class="social-link" href="https://x.com/taso_he"
         aria-label="TASO on X">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l8.2-9.4L.8 2h6.5l4.5 6.7L18.9 2Zm-1.1 18h1.7L6.4 3.9H4.6L17.8 20Z"/>
        </svg>
      </a>

      <a class="social-link"
         href="https://uk.linkedin.com/company/taso"
         aria-label="TASO on LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM7.93 18.75H4.98V9.2h2.95v9.55ZM6.45 7.89a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12.3 10.86H15.8V14.1c0-1.11-.02-2.54-1.55-2.54-1.55 0-1.79 1.21-1.79 2.46v4.73H9.51V9.2h2.83v1.3h.04c.39-.74 1.36-1.53 2.79-1.53 2.98 0 3.58 1.96 3.58 4.51v5.27Z"/>
        </svg>
      </a>

      <a class="homepage-link" href="https://taso.org.uk/">
        TASO homepage
      </a>
    </nav>
  </template>
</head>
<body>
  <div class="review-tools">
    <p><strong>Design review</strong> — live site unchanged</p>
    <button id="download" type="button" disabled>
      Download edited HTML
    </button>
  </div>
  <p id="status" role="status">Loading the explorer for review…</p>
  <iframe id="preview" title="APP Explorer design preview"></iframe>

  <script>
    (async function () {
      const status = document.getElementById("status");
      const download = document.getElementById("download");
      const preview = document.getElementById("preview");

      try {
        const response = await fetch(
          "https://raw.githubusercontent.com/taso-he/" +
          "APP_Explorer_External/main/index.html",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("GitHub returned HTTP " + response.status);
        }

        let html = await response.text();

        if (!html.includes('<div class="topbar">') ||
            !html.includes("</head>")) {
          throw new Error("The source layout has changed.");
        }

        // Preserve the explorer's code and data functionality.
        // Use the existing map data when reviewing a local HTML file.
        html = html.replace(
          'fetch("data/geo.json")',
          'fetch("https://raw.githubusercontent.com/taso-he/' +
          'APP_Explorer_External/main/data/geo.json")'
        );

        const doc = new DOMParser().parseFromString(html, "text/html");

        const font = doc.querySelector(
          'link[href*="fonts.googleapis.com/css2"]'
        );
        if (font) {
          font.setAttribute(
            "href",
            "https://fonts.googleapis.com/css2?" +
            "family=Barlow:wght@400;500;600;700&" +
            "family=Neuton:wght@400&display=swap"
          );
        }

        const style = doc.createElement("style");
        style.textContent =
          document.getElementById("review-css").textContent;
        doc.head.appendChild(style);

        const topbar = doc.querySelector(".topbar");
        const oldHomepage = topbar.querySelector(".home-link");
        if (oldHomepage) oldHomepage.remove();

        topbar.appendChild(
          document.getElementById("header-links")
            .content.cloneNode(true)
        );

        // Remove a forced line break from the smaller headline.
        doc.querySelectorAll("h1 .title-break").forEach(function (br) {
          br.replaceWith(doc.createTextNode(" "));
        });

        const revised =
          "<!doctype html>\n" + doc.documentElement.outerHTML;

        const file = new Blob([revised], {
          type: "text/html;charset=utf-8"
        });
        const fileURL = URL.createObjectURL(file);

        download.disabled = false;
        download.addEventListener("click", function () {
          const link = document.createElement("a");
          link.href = fileURL;
          link.download = "APP_Explorer_review_full.html";
          link.click();
        });

        preview.srcdoc = revised;
        status.textContent =
          "Preview ready. Download edited HTML to save the complete file.";
      } catch (error) {
        status.textContent =
          "Could not load the preview: " + error.message +
          ". Check your internet connection and reload this file.";
      }
    })();
  </script>
</body>
</html>
